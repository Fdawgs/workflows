name: Reusable Lock Threads

# **What it does**: Automatically locks inactive issues and pull requests.
# **Why we have it**: Helps maintainers manage repository activity and reduce clutter.

on:
  workflow_call:

jobs:
    lock-threads:
        name: Reusable Lock Threads
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: Lock inactive issues and prs
              uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
              with:
                exclude-any-issue-labels: 'help wanted'
                issue-comment: >
                    This issue has been automatically locked since there
                    has not been any recent activity after it was closed.
                    Please open a new issue for related bugs.
                issue-inactive-days: '90'
                pr-comment: >
                    This pull request has been automatically locked since there
                    has not been any recent activity after it was closed.
                    Please open a new issue for related bugs.
                pr-inactive-days: '90'
