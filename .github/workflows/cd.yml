name: CD

# **What it does**: Automatically generates releases and release notes.
# **Why we have it**: Allows development to focus on higher value work.

on:
    workflow_dispatch:
        inputs:
            semver:
                description: "The semver to use"
                required: true
                default: "patch"
    pull_request:
        types: [closed]

permissions:
    contents: read

jobs:
    release:
        name: Create/Update Release Pull Request
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  check-latest: true
                  node-version: lts/*

            - name: Run Optic
              uses: nearform-actions/optic-release-automation-action@08642f7889f3bb519fb69ce2c3bf58e4f900c018 # v4.12.4
              with:
                  commit-message: "chore(release): release {version}"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  notify-linked-issues: false
                  publish-mode: none
                  semver: ${{ github.event.inputs.semver }}
                  sync-semver-tags: true
