name: CD

# **What it does**: Automatically generates releases and release notes.
# **Why we have it**: Allows development to focus on higher value work.

on:
    workflow_dispatch:
        inputs:
            semver:
                description: "The semver to use"
                required: true
                default: "patch"
    pull_request:
        types: [closed]

permissions:
    contents: read

jobs:
    release:
        name: Create/Update Release Pull Request
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  check-latest: true
                  node-version: lts/*

            - name: Run Optic
              uses: nearform-actions/optic-release-automation-action@212ac6a8d5c859eb7683ddb3dbbbd52a6084f30c # v4.13.0
              with:
                  commit-message: "chore(release): release {version}"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  notify-linked-issues: false
                  publish-mode: none
                  semver: ${{ github.event.inputs.semver }}
                  sync-semver-tags: true
