name: Check Markdown for Broken Links

# **What it does**: Checks all links in markdown files, apart from links to repo commits and issues.
# **Why we have it**: We want to know if any links break.

on:
  workflow_call:

jobs:
    link-check:
        name: Reusable Link Check
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repo
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Run Linkinator
              uses: JustinBeckwith/linkinator-action@af984b9f30f63e796ae2ea5be5e07cb587f1bbd9 # v2.3
              with:
                linksToSkip: "http://0.0.0.0, http://127.0.0.1, http://localhost"
                # Ignoring CHANGELOG.md as all the github.com links cause rate limiting
                paths: "**/!(CHANGELOG).md"
                requireHttps: true
                retry: true
