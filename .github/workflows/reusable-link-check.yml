name: Reusable Link Check

# **What it does**: Checks all links in markdown files, apart from links to repo commits and issues.
# **Why we have it**: We want to know if any links break.

on:
  workflow_call:

jobs:
    link-check:
        name: Reusable Link Check
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repo
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Run Linkinator
              uses: JustinBeckwith/linkinator-action@f62ba0c110a76effb2ee6022cc6ce4ab161085e3 # v2.4
              with:
                linksToSkip: "http://0.0.0.0"
                paths: "**/!(CHANGELOG).md"
                requireHttps: true
                retry: true
