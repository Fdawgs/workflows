name: Reusable Link Check

# **What it does**: Checks all links in markdown files, apart from links to repo commits and issues.
# **Why we have it**: We want to know if any links break.

on:
    workflow_call:

permissions:
    contents: read

jobs:
    link-check:
        name: Reusable Link Check
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repo
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Run Linkinator
              uses: JustinBeckwith/linkinator-action@7b6b0bc671f6264e1a8daa4488a5bd91ce61dcd4 # v2.4.2
              with:
                  linksToSkip: "http://0.0.0.0"
                  paths: "**/!(CHANGELOG).md"
                  requireHttps: true
                  retry: true
