name: Reusable Link Check

# **What it does**: Checks all links in markdown files, apart from links to repo commits and issues.
# **Why we have it**: We want to know if any links break.

on:
    workflow_call:

permissions: {}

jobs:
    link-check:
        name: Reusable Link Check
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run Linkinator
              uses: JustinBeckwith/linkinator-action@12f7a61a56e5e75d659f0dfd6357e2d852ede281 # v2.5.0
              with:
                  linksToSkip: "http://0.0.0.0"
                  paths: "**/!(CHANGELOG).md"
                  requireHttps: true
                  retry: true
                  serverRoot: ${{ github.workspace }}
